# CaraProjetada — LightDM auto-login config
# Copie para /etc/lightdm/lightdm.conf ou /etc/lightdm/lightdm.conf.d/01-autologin.conf
#
# Garante que o sistema já entre direto no desktop sem tela de login
# Necessário para o kiosk chromium iniciar no boot

[Seat:*]
autologin-user=carapreta
autologin-user-timeout=0

[LightDM]
minimum-vt=1
user-session=openbox
